<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E68"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B6E68" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="24" fill="#F3F7F6"/>
  <text x="40" y="46" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#15171A">How it fits together</text>

  <!-- left: chat client -->
  <rect x="40" y="175" width="220" height="90" rx="14" fill="#FFFFFF" stroke="#0B6E68" stroke-width="2" filter="url(#soft)"/>
  <text x="150" y="212" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0B6E68">qwen-chat.py</text>
  <text x="150" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#4B4E48">terminal REPL client</text>

  <path d="M262,220 L372,220" stroke="#0B6E68" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- center: LM Studio -->
  <rect x="378" y="140" width="260" height="160" rx="18" fill="#0B6E68" filter="url(#soft)"/>
  <text x="508" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">LM Studio</text>
  <text x="508" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#D7EFEC">local server · your model</text>
  <rect x="438" y="248" width="140" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="508" y="268" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#FFFFFF">localhost:1234</text>

  <!-- fan-out arrows -->
  <path d="M640,175 C 700,175 700,100 760,100" stroke="#0B6E68" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640,220 L 760,220" stroke="#0B6E68" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640,265 C 700,265 700,340 760,340" stroke="#0B6E68" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- right: mcp tools -->
  <rect x="768" y="65" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#9A5B10" stroke-width="2" filter="url(#soft)"/>
  <text x="868" y="94" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#9A5B10">terminal</text>
  <text x="868" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#4B4E48">shell &amp; files</text>

  <rect x="768" y="185" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#9A5B10" stroke-width="2" filter="url(#soft)"/>
  <text x="868" y="214" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#9A5B10">browser</text>
  <text x="868" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#4B4E48">your real Chrome</text>

  <rect x="768" y="305" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#9A5B10" stroke-width="2" filter="url(#soft)"/>
  <text x="868" y="334" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#9A5B10">websearch</text>
  <text x="868" y="355" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#4B4E48">keyless, no API</text>
</svg>
